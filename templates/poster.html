<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>视频海报墙</title>

<!-- 关键 CSS 内联：消除渲染阻塞 -->
<style>
/* Reset + Shell + Hero + Skeleton (首屏关键) */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;color:#1c1917;background:#fafaf9;min-height:100dvh;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.shell{max-width:960px;margin:0 auto;padding:0 1.5rem}
@media(max-width:640px){.shell{padding:0 1rem}}
.hero{margin-top:1.5rem;margin-bottom:1.25rem}
.hero-nav{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:6px;color:#78716c;font-size:13px;margin-bottom:12px;text-decoration:none}
.hero-nav:hover{color:#4b5563}
.hero h1{margin:4px 0 8px;font-size:1.5rem;font-weight:700;line-height:1.2}
.hero p{max-width:520px;color:#78716c;line-height:1.65;font-size:14px}
/* Skeleton 预渲染 */
.skeleton{border-radius:6px;overflow:hidden;background:#fff;border:1px solid #e7e5e4}
.sk-cover{aspect-ratio:16/9;background:#f5f4f0}
.sk-body{padding:12px}
.sk-line{height:8px;border-radius:4px;margin-bottom:8px;background:#f5f4f0}
.sk-line:last-child{width:55%}
</style>

<!-- 完整 CSS 异步加载 -->
<link rel="preload" href="{{ url_for('static', path='css/design-system.css') }}" as="style" onload="this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="{{ url_for('static', path='css/design-system.css') }}" /></noscript>

<!-- 预连接 API 源 -->
<link rel="preconnect" href="/api" />
</head>
<body>

<!-- SVG Sprite 定义 -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></symbol>
</svg>

<div class="shell">
  <!-- Hero -->
  <section class="hero">
    <a class="hero-nav" href="/">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#icon-chevron"/></svg>
      返回
    </a>
    <h1 id="pageTitle">视频海报墙</h1>
    <p>点击海报即可预览视频，可按文件夹筛选、排序和批量操作。</p>
    <div class="hero-st" style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1rem">
      <div class="hero-it" style="min-width:80px">
        <div class="hero-l" style="color:#a8a29e;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px">筛选结果</div>
        <div class="hero-v" id="statVisible" style="font-size:1.25rem;font-weight:700">0</div>
      </div>
      <div class="hero-it">
        <div class="hero-l" style="color:#a8a29e;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px">全部视频</div>
        <div class="hero-v" id="statTotal" style="font-size:1.25rem;font-weight:700">0</div>
      </div>
      <div class="hero-it">
        <div class="hero-l" style="color:#a8a29e;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px">文件夹</div>
        <div class="hero-v" id="statFolders" style="font-size:1.25rem;font-weight:700">0</div>
      </div>
    </div>
  </section>

  <!-- Toolbar -->
  <section class="tbar" style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #e7e5e4;margin-bottom:1rem">
    <div class="tbar-sel" style="display:flex;flex-direction:column;gap:2px;min-width:120px">
      <label for="folderFilter" style="font-size:10px;color:#a8a29e;text-transform:uppercase;letter-spacing:.06em;font-weight:600">文件夹筛选</label>
      <select id="folderFilter" onchange="applyFilters()" style="height:30px;font-size:12px"></select>
    </div>
    <div class="tbar-sel" style="display:flex;flex-direction:column;gap:2px;min-width:120px">
      <label for="sortSelect" style="font-size:10px;color:#a8a29e;text-transform:uppercase;letter-spacing:.06em;font-weight:600">排序</label>
      <select id="sortSelect" onchange="applyFilters(false)" style="height:30px;font-size:12px">
        <option value="time_desc">按名称降序</option>
        <option value="time_asc">按名称升序</option>
        <option value="size_desc">大小从大到小</option>
        <option value="size_asc">大小从小到大</option>
        <option value="duration_desc">时长从长到短</option>
        <option value="duration_asc">时长从短到长</option>
      </select>
    </div>
    <div class="tbar-sel" style="display:flex;flex-direction:column;gap:2px;min-width:80px">
      <label for="pageSizeSelect" style="font-size:10px;color:#a8a29e;text-transform:uppercase;letter-spacing:.06em;font-weight:600">每页</label>
      <select id="pageSizeSelect" onchange="changePageSize()" style="height:30px;font-size:12px">
        <option value="10">10</option><option value="15">15</option><option value="20">20</option>
        <option value="25">25</option><option value="30">30</option>
      </select>
    </div>
    <div style="flex:1"></div>
    <button class="btn btn-gho btn-sm" onclick="reloadData()" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;background:transparent;color:#78716c">刷新</button>
    <button class="btn btn-gho btn-sm" onclick="toggleSelectAll()" id="btnSelectAll" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;background:transparent;color:#78716c">全选</button>
    <button class="btn btn-dgr btn-sm" id="btnBatchDelete" onclick="batchDelete()" disabled style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;background:#dc2626;color:#fff;opacity:.4;pointer-events:none">批量删除</button>
  </section>

  <!-- Status Bar -->
  <div class="sbar" style="display:flex;justify-content:space-between;align-items:center;gap:12px;color:#78716c;font-size:13px;flex-wrap:wrap;margin-bottom:12px">
    <div id="statusText">正在加载…</div>
    <div>已选 <strong id="selectedCount" style="color:#1c1917;font-weight:600">0</strong> 个</div>
  </div>

  <!-- Grid -->
  <div id="grid" class="mgrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px"></div>
  <div id="emptyMsg" class="empty" style="display:none;padding:2.5rem 1rem;text-align:center;color:#a8a29e">当前筛选条件下暂无视频。</div>

  <!-- Pagination -->
  <div id="pagination" class="pag hidden" style="display:none;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid #e7e5e4;border-radius:6px;background:#fff;margin-top:1rem">
    <div id="paginationInfo" class="pag-i" style="color:#78716c;font-size:13px">第 1 / 1 页</div>
    <div class="pag-a" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn btn-sec btn-sm" id="btnFirstPage" onclick="setPage(1)" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border:1px solid #e7e5e4;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:#1c1917">首页</button>
      <button class="btn btn-sec btn-sm" id="btnPrevPage" onclick="changePage(-1)" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border:1px solid #e7e5e4;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:#1c1917">上一页</button>
      <button class="btn btn-sec btn-sm" id="btnNextPage" onclick="changePage(1)" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border:1px solid #e7e5e4;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:#1c1917">下一页</button>
      <button class="btn btn-sec btn-sm" id="btnLastPage" onclick="setPage(getTotalPages())" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border:1px solid #e7e5e4;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:#1c1917">末页</button>
    </div>
  </div>
</div>

<!-- Player Modal -->
<div id="previewModal" class="ply" onclick="closePreviewOnMask(event)" role="dialog" aria-modal="true" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,.8);z-index:200">
  <div class="ply-c" style="width:min(860px,100%);background:#fff;border-radius:8px;overflow:hidden">
    <div class="ply-h" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 1rem;border-bottom:1px solid #e7e5e4">
      <div>
        <div class="ply-t" id="previewTitle" style="font-weight:600;font-size:13px;word-break:break-word">视频预览</div>
        <div class="mute-d text-xs" id="previewMeta" style="margin-top:2px;color:#a8a29e;font-size:12px"></div>
      </div>
      <button class="ply-x" onclick="closePreview()" style="width:28px;height:28px;border-radius:6px;border:1px solid #e7e5e4;background:#fff;color:#78716c;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><use href="#icon-close"/></svg>
      </button>
    </div>
    <video id="previewVideo" class="ply-v" controls preload="metadata" style="width:100%;max-height:76vh;display:block;background:#000"></video>
  </div>
</div>

<!-- Replace Cover Modal -->
<div id="replaceModal" class="modal" onclick="closeReplaceOnMask(event)" role="dialog" aria-modal="true" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,.15);z-index:1000">
  <div class="modal-d" style="width:min(420px,100%);max-height:min(85vh,600px);display:flex;flex-direction:column;background:#fff;border:1px solid #e7e5e4;border-radius:8px;overflow:hidden">
    <div class="modal-h" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:1rem;border-bottom:1px solid #e7e5e4">
      <div>
        <h2 class="modal-t" style="font-size:1rem;font-weight:600">替换封面</h2>
        <p class="modal-s" id="replaceMeta" style="margin-top:2px;font-size:13px;color:#78716c">选择新的封面图片</p>
      </div>
      <button type="button" class="dclose" onclick="closeReplaceModal()" style="width:28px;height:28px;border:1px solid #e7e5e4;background:#fff;color:#78716c;border-radius:6px;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">&times;</button>
    </div>
    <div class="modal-b" style="padding:1rem;overflow-y:auto;flex:1">
      <input type="file" id="replaceFileInput" accept="image/*" style="padding:8px 0;border:none;background:transparent;width:100%" />
    </div>
    <div class="modal-f" style="display:flex;justify-content:flex-end;gap:8px;padding:12px 1rem;border-top:1px solid #e7e5e4">
      <button type="button" class="btn btn-sec" onclick="closeReplaceModal()" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 12px;border:1px solid #e7e5e4;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#1c1917">取消</button>
      <button type="button" class="btn btn-pri" onclick="doReplaceCover()" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 12px;border:1px solid #4b5563;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:#4b5563;color:#fff">确认替换</button>
    </div>
  </div>
</div>

<script>
(function(){
  const params=new URLSearchParams(location.search), INITIAL_FOLDER=params.get('folder')||'';
  let allItems=[], visibleItems=[], selectedKeys=new Set(), durationCache=new Map(), replaceTarget=null, currentPage=1;

  function itemKey(i){ return i.folder+'::'+i.stem; }
  function esc(v){ return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
  function fmtSize(b){ if(b>=1073741824)return(b/1073741824).toFixed(2)+' GB'; if(b>=1048576)return(b/1048576).toFixed(1)+' MB'; if(b>=1024)return(b/1024).toFixed(0)+' KB'; return b+' B'; }
  function durL(i){ return i.duration||durationCache.get(itemKey(i))||'--:--'; }
  function durS(i){ const r=i.duration||durationCache.get(itemKey(i))||'',p=r.split(':').map(Number); if(!p.length||p.some(isNaN))return -1; if(p.length===2)return p[0]*60+p[1]; if(p.length===3)return p[0]*3600+p[1]*60+p[2]; return -1; }
  function getPS(){ return Number(document.getElementById('pageSizeSelect').value)||10; }
  function getTP(){ return Math.max(1,Math.ceil(visibleItems.length/getPS())); }
  function clampCP(){ currentPage=Math.min(Math.max(currentPage,1),getTP()); }
  function getCPI(){ const ps=getPS(),s=(currentPage-1)*ps; return visibleItems.slice(s,s+ps); }

  async function loadItems(){
    const q=new URLSearchParams(), fv=document.getElementById('folderFilter').value; if(fv)q.set('folder',fv);
    const url=q.toString()?'/api/poster?'+q.toString():'/api/poster', r=await fetch(url), d=await r.json();
    if(!d.ok)throw new Error(d.error||'加载失败');
    allItems=d.items||[]; (d.items||[]).forEach(i=>{ if(i.duration)durationCache.set(itemKey(i),i.duration); });
    renderFolderOptions(d.folders||[]); updateStats(d.folders||[]); applyFilters(false);
    // 首次加载完成后轮询时长（后台异步探测）
    setTimeout(pollDurations, 2000);
  }
  function renderFolderOptions(folders){
    const s=document.getElementById('folderFilter'), cv=s.value||INITIAL_FOLDER;
    let o='<option value="">全部文件夹</option>';
    folders.forEach(f=>{ o+='<option value="'+f.folder+'">'+(f.folder||'根目录')+' ('+f.count+')</option>'; });
    s.innerHTML=o; if(cv&&folders.some(f=>f.folder===cv))s.value=cv; else s.value=''; syncPT();
  }
  function updateStats(){ document.getElementById('statTotal').textContent=''+allItems.length; }
  function syncPT(){ const fv=document.getElementById('folderFilter').value; document.getElementById('pageTitle').textContent=fv?fv+' · 海报墙':'视频海报墙'; history.replaceState(null,'',fv?'/poster?folder='+encodeURIComponent(fv):'/poster'); }

  function applyFilters(need){
    if(need){ reloadData(); return; }
    const fv=document.getElementById('folderFilter').value, sv=document.getElementById('sortSelect').value;
    visibleItems=allItems.filter(i=>!fv||i.folder===fv);
    visibleItems.sort((a,b)=>{
      if(sv==='time_asc')return a.stem.localeCompare(b.stem); if(sv==='time_desc')return b.stem.localeCompare(a.stem);
      if(sv==='size_asc')return a.size-b.size; if(sv==='size_desc')return b.size-a.size;
      if(sv==='duration_asc')return durS(a)-durS(b); if(sv==='duration_desc')return durS(b)-durS(a); return 0;
    });
    selectedKeys=new Set([...selectedKeys].filter(k=>visibleItems.some(i=>itemKey(i)===k)));
    currentPage=1; syncPT(); renderGrid();
  }
  function updateST(){
    const fv=document.getElementById('folderFilter').value, p=fv?fv+' · ':'全部 · ';
    document.getElementById('statusText').innerHTML=p+'共 <strong>'+visibleItems.length+'</strong> 个，第 <strong>'+currentPage+'</strong>/<strong>'+getTP()+'</strong> 页';
    document.getElementById('selectedCount').textContent=''+selectedKeys.size;
    document.getElementById('statVisible').textContent=''+visibleItems.length;
    document.getElementById('statFolders').textContent=''+(document.getElementById('folderFilter').options.length-1);
    document.getElementById('btnBatchDelete').disabled=selectedKeys.size===0;
    document.getElementById('btnBatchDelete').style.opacity=selectedKeys.size===0?'.4':'1';
    document.getElementById('btnBatchDelete').style.pointerEvents=selectedKeys.size===0?'none':'auto';
    document.getElementById('btnSelectAll').textContent=visibleItems.length>0&&visibleItems.every(i=>selectedKeys.has(itemKey(i)))?'取消全选':'全选';
  }
  function renderPag(){
    const p=document.getElementById('pagination'), tp=getTP();
    if(visibleItems.length===0){ p.style.display='none'; return; }
    p.style.display='flex';
    document.getElementById('paginationInfo').textContent='第 '+currentPage+'/'+tp+' 页，共 '+visibleItems.length+' 项';
    document.getElementById('btnFirstPage').disabled=currentPage===1;
    document.getElementById('btnPrevPage').disabled=currentPage===1;
    document.getElementById('btnNextPage').disabled=currentPage===tp;
    document.getElementById('btnLastPage').disabled=currentPage===tp;
  }
  function renderSkeletons(c){
    const g=document.getElementById('grid');
    document.getElementById('emptyMsg').style.display='none';
    document.getElementById('pagination').style.display='none';
    let h=''; for(let i=0;i<c;i++)h+='<div class="skeleton"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line" style="width:55%"></div></div></div>'; g.innerHTML=h;
  }

  function createCardElement(i){
    const k=itemKey(i), sel=selectedKeys.has(k);
    const card=document.createElement('article');
    card.className='mcard'+(sel?' sel':'');
    card.dataset.key=k;
    // Checkbox
    const cb=document.createElement('input');
    cb.className='msel'; cb.type='checkbox'; cb.checked=sel;
    cb.setAttribute('aria-label','选择视频');
    cb.onchange=function(e){ e.stopPropagation(); toggleSelect(k); };
    card.appendChild(cb);
    // Cover
    const cv=document.createElement('div');
    cv.className='mcv'; cv.setAttribute('role','button'); cv.tabIndex=0;
    cv.setAttribute('aria-label','预览 '+esc(i.video));
    cv.onclick=function(){ openPreview(k); };
    cv.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();openPreview(k);} };
    if(i.thumbnail_url){
      const img=document.createElement('img');
      img.src=i.thumbnail_url; img.alt=esc(i.video);
      img.loading='lazy'; img.width=320; img.height=180;
      cv.appendChild(img);
    }else{
      const fb=document.createElement('div'); fb.className='fb'; fb.textContent='MV'; cv.appendChild(fb);
    }
    // Play button
    const play=document.createElement('div'); play.className='mplay'; play.setAttribute('aria-hidden','true');
    play.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><use href="#icon-play"/></svg>';
    cv.appendChild(play);
    // Duration
    const dur=document.createElement('div'); dur.className='mdur'; dur.textContent=durL(i);
    dur.dataset.dk=k; cv.appendChild(dur);
    card.appendChild(cv);
    // Body
    const bd=document.createElement('div'); bd.className='mbd';
    bd.innerHTML='<div class="mnm" title="'+esc(i.video)+'">'+esc(i.video)+'</div>'
      +'<div class="mmt"><span class="mpil">'+fmtSize(i.size)+'</span><span class="mpil">'+esc(i.folder||'根目录')+'</span>'
      +'<span class="mpil">时长 <span data-dk="'+k+'">'+durL(i)+'</span></span></div>'
      +'<div class="mac"><button class="btn btn-sec btn-sm" onclick="openReplaceModal(\''+k+'\')">替换封面</button>'
      +'<button class="btn btn-sec btn-sm" onclick="uploadToDisk(\''+k+'\')">上传到网盘</button>'
      +'<button class="btn btn-dgr btn-sm" onclick="deleteItem(\''+k+'\')">删除</button></div>';
    card.appendChild(bd);
    return card;
  }

  function renderGrid(){
    const g=document.getElementById('grid'), e=document.getElementById('emptyMsg'); clampCP(); const pi=getCPI(); updateST();
    if(visibleItems.length===0){ g.innerHTML=''; e.style.display='block'; renderPag(); return; }
    e.style.display='none';
    const frag=document.createDocumentFragment();
    for(const i of pi)frag.appendChild(createCardElement(i));
    g.innerHTML=''; g.appendChild(frag);
    renderPag();
  }

  function setPage(p){ const n=Math.min(Math.max(Number(p)||1,1),getTP()); if(n===currentPage)return; currentPage=n; renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); }
  function changePage(d){ setPage(currentPage+d); }
  function changePageSize(){ currentPage=1; renderGrid(); }
  function findByKey(k){ return allItems.find(i=>itemKey(i)===k)||null; }

  // P1-1: toggleSelect 局部 DOM 更新（不再全量 renderGrid）
  function toggleSelect(k){
    if(selectedKeys.has(k))selectedKeys.delete(k); else selectedKeys.add(k);
    const card=document.querySelector('[data-key="'+CSS.escape(k)+'"]');
    if(card){
      card.classList.toggle('sel',selectedKeys.has(k));
      const cb=card.querySelector('.msel');
      if(cb)cb.checked=selectedKeys.has(k);
    }
    updateST();
  }
  function toggleSelectAll(){
    if(visibleItems.length===0)return;
    const allSel=visibleItems.every(i=>selectedKeys.has(itemKey(i)));
    const g=document.getElementById('grid');
    if(allSel){
      visibleItems.forEach(i=>selectedKeys.delete(itemKey(i)));
    }else{
      visibleItems.forEach(i=>selectedKeys.add(itemKey(i)));
    }
    // 批量更新 DOM
    for(const i of visibleItems){
      const card=g.querySelector('[data-key="'+CSS.escape(itemKey(i))+'"]');
      if(card){
        card.classList.toggle('sel',selectedKeys.has(itemKey(i)));
        const cb=card.querySelector('.msel');
        if(cb)cb.checked=selectedKeys.has(itemKey(i));
      }
    }
    updateST();
  }

  function openPreview(k){
    const i=findByKey(k); if(!i)return;
    document.getElementById('previewTitle').textContent=i.video;
    document.getElementById('previewMeta').textContent=(i.folder||'根目录')+' · '+fmtSize(i.size)+' · 时长 '+durL(i);
    const v=document.getElementById('previewVideo'); v.poster=i.thumb_url||i.thumbnail_url||''; v.src=i.video_url; v.play().catch(function(){}); document.getElementById('previewModal').style.display='flex'; document.body.classList.add('modal-open');
  }
  function closePreview(){ const v=document.getElementById('previewVideo'); v.pause(); v.src=''; v.poster=''; document.getElementById('previewModal').style.display='none'; document.body.classList.remove('modal-open'); }
  function closePreviewOnMask(e){ if(e.target.id==='previewModal')closePreview(); }
  function openReplaceModal(k){ const i=findByKey(k); if(!i)return; replaceTarget=i; document.getElementById('replaceMeta').textContent=(i.folder||'根目录')+' · '+i.video; document.getElementById('replaceFileInput').value=''; document.getElementById('replaceModal').style.display='flex'; document.body.classList.add('modal-open'); }
  function closeReplaceModal(){ replaceTarget=null; document.getElementById('replaceModal').style.display='none'; document.body.classList.remove('modal-open'); }
  function closeReplaceOnMask(e){ if(e.target.id==='replaceModal')closeReplaceModal(); }
  async function doReplaceCover(){ const inp=document.getElementById('replaceFileInput'); if(!replaceTarget)return; if(!inp.files||!inp.files[0]){ alert('请选择图片文件'); return; }
    const fd=new FormData(); fd.append('folder',replaceTarget.folder); fd.append('stem',replaceTarget.stem); fd.append('file',inp.files[0]);
    const r=await fetch('/api/poster/replace-cover',{method:'POST',body:fd}),d=await r.json();
    if(!d.ok){ alert(d.error||'替换失败'); return; }
    replaceTarget.thumb=d.thumb; replaceTarget.thumbnail_url='/api/poster-thumb?folder='+encodeURIComponent(replaceTarget.folder)+'&name='+encodeURIComponent(d.thumb)+'&t='+Date.now(); closeReplaceModal(); renderGrid();
  }
  async function deleteItem(k){ const i=findByKey(k); if(!i||!confirm('确认删除 '+i.video+' 吗？'))return;
    const r=await fetch('/api/poster/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:i.folder,stems:[i.stem]})}),d=await r.json();
    if(!d.ok){ alert(d.error||'删除失败'); return; } allItems=allItems.filter(c=>itemKey(c)!==k); selectedKeys.delete(k); applyFilters(false);
  }
  async function batchDelete(){ if(selectedKeys.size===0||!confirm('确认删除选中的 '+selectedKeys.size+' 个视频吗？'))return;
    const g=new Map(); visibleItems.filter(i=>selectedKeys.has(itemKey(i))).forEach(i=>{ if(!g.has(i.folder))g.set(i.folder,[]); g.get(i.folder).push(i.stem); });
    for(const[f,ss]of g){ const r=await fetch('/api/poster/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:f,stems:ss})}),d=await r.json(); if(!d.ok){ alert(d.error||'删除失败'); return; } }
    allItems=allItems.filter(i=>!selectedKeys.has(itemKey(i))); selectedKeys.clear(); applyFilters(false);
  }

  // P1-2: 轮询后端补充时长（替代客户端 video 探测）
  async function pollDurations(){
    const fv=document.getElementById('folderFilter').value;
    try{
      const r=await fetch('/api/poster-durations?folder='+encodeURIComponent(fv));
      const d=await r.json();
      if(d.ok){
        Object.entries(d.durations).forEach(([k,v])=>{
          if(!durationCache.has(k)){
            durationCache.set(k,v);
            // 更新 DOM 中所有该 key 的时长展示
            document.querySelectorAll('[data-dk="'+CSS.escape(k)+'"]').forEach(n=>{n.textContent=v;});
          }
        });
        // 如果有新补充的时长，更新排序（重排但不重渲染）
        if(Object.keys(d.durations).length>0)renderGrid();
      }
    }catch(e){/* 静默处理 */}
  }
  // 5 秒后再轮询一次（覆盖后台异步完成）
  setTimeout(function(){ pollDurations(); }, 5000);
  setTimeout(function(){ pollDurations(); }, 12000);

  function pad(n){ return n<10?'0'+n:''+n; }
  async function uploadToDisk(k){
    const i=findByKey(k); if(!i)return;
    if(!confirm('确认将 '+i.video+' 上传到网盘吗？'))return;
    try{
      const r=await fetch('/api/openlist/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:i.folder,stem:i.stem})});
      const d=await r.json();
      if(d.ok&&d.result&&d.result.ok){ alert('上传完成'); }else{ alert('上传失败：'+(d.result?.video?.msg||d.message||'未知错误')); }
    }catch(e){ alert('网络错误'); }
  }
  async function reloadData(){ document.getElementById('statusText').textContent='正在刷新…'; renderSkeletons(getPS()); try{ await loadItems(); } catch(e){ document.getElementById('grid').innerHTML=''; document.getElementById('emptyMsg').style.display='block'; document.getElementById('statusText').textContent=e.message||'加载失败'; } }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closePreview(); closeReplaceModal(); } });
  document.getElementById('folderFilter').value=INITIAL_FOLDER; reloadData();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频海报墙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #050509;
      --bg-soft: rgba(13, 13, 20, 0.78);
      --panel: rgba(13, 13, 20, 0.92);
      --panel-border: rgba(148, 148, 168, 0.16);
      --card: rgba(13, 13, 20, 0.9);
      --text: #f5f5fa;
      --muted: #a7a7b8;
      --accent: #f43f5e;
      --accent-strong: #e11d48;
      --accent-glow: rgba(244, 63, 94, 0.45);
      --danger: #ef4444;
      --shadow: 0 26px 60px rgba(0, 0, 0, 0.6);
      --font-sans: "Fira Sans", "Segoe UI", Arial, sans-serif;
      --font-mono: "Fira Code", ui-monospace, "Segoe UI Mono", monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(225, 29, 72, 0.16), transparent 32%),
        radial-gradient(circle at top right, rgba(124, 58, 137, 0.12), transparent 30%),
        linear-gradient(180deg, #08080f 0%, #050509 52%, #000000 100%);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .shell {
      max-width: 1560px;
      margin: 0 auto;
      padding: 28px 24px 40px;
    }
    .hero {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 26px 28px;
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(16, 16, 26, 0.96), rgba(10, 10, 18, 0.74));
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      margin-bottom: 18px;
      flex-wrap: wrap;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 18px var(--accent-glow);
    }
    .hero-top {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.22);
      color: #fecdd3;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .hero h1 {
      margin: 14px 0 10px;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-shadow: 0 0 26px rgba(244, 63, 94, 0.22);
    }
    .hero p {
      margin: 0;
      max-width: 680px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }
    .hero-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .stat-card {
      min-width: 140px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(13, 13, 20, 0.72);
      border: 1px solid rgba(148, 148, 168, 0.14);
    }
    .stat-card .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .stat-card .value {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .toolbar {
      position: sticky;
      top: 14px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 18px;
      border-radius: 20px;
      background: var(--bg-soft);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
      margin-bottom: 18px;
    }
    .toolbar .spacer {
      flex: 1;
    }
    .control {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 170px;
    }
    .control label {
      font-size: 12px;
      color: var(--muted);
    }
    select {
      width: 100%;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(148, 148, 168, 0.18);
      background: rgba(13, 13, 20, 0.84);
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    select:hover {
      border-color: rgba(244, 63, 94, 0.4);
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    select:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.25);
      outline: none;
    }
    .btn {
      height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      opacity: .96;
    }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 12px 26px rgba(225, 29, 72, 0.38);
    }
    .btn-secondary {
      background: rgba(28, 28, 38, 0.9);
      border-color: rgba(148, 148, 168, 0.18);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: rgba(244, 63, 94, 0.4);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 12px 26px rgba(220, 38, 38, 0.28);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      margin: 8px 0 16px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    .status-row strong {
      color: var(--text);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }
    .skeleton-card {
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(16, 16, 26, 0.98), rgba(10, 10, 18, 0.8));
      border: 1px solid rgba(148, 148, 168, 0.12);
    }
    .skeleton-cover {
      aspect-ratio: 16 / 9;
    }
    .skeleton-body {
      padding: 16px;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .skeleton-line.short {
      width: 55%;
    }
    .skeleton-cover,
    .skeleton-line {
      position: relative;
      overflow: hidden;
      background: rgba(148, 148, 168, 0.1);
    }
    .skeleton-cover::after,
    .skeleton-line::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(244, 63, 94, 0.12), transparent);
      animation: shimmer 1.3s ease-in-out infinite;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
    .card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(16, 16, 26, 0.98), rgba(10, 10, 18, 0.8));
      border: 1px solid rgba(148, 148, 168, 0.14);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.46);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 26px 52px rgba(0, 0, 0, 0.56), 0 0 0 1px rgba(244, 63, 94, 0.3);
    }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 22px rgba(244, 63, 94, 0.35), 0 26px 52px rgba(0, 0, 0, 0.5);
    }
    .cover {
      position: relative;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(16, 16, 26, 0.95), rgba(28, 28, 38, 0.75));
      overflow: hidden;
    }
    .cover:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .cover img,
    .cover .fallback {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover img {
      opacity: 0;
      transition: opacity .35s ease, transform .4s ease;
      transform: scale(1.02);
    }
    .cover img.loaded {
      opacity: 1;
      transform: scale(1);
    }
    .cover .fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(244, 63, 94, 0.32);
      font-family: var(--font-mono);
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.04) 40%, rgba(0, 0, 0, 0.72));
    }
    .play-badge,
    .date-badge,
    .duration-badge {
      position: absolute;
      z-index: 1;
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }
    .play-badge {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 58px;
      height: 58px;
      border: 1px solid rgba(244, 63, 94, 0.5);
      background: rgba(225, 29, 72, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 22px rgba(244, 63, 94, 0.45);
      transition: transform .2s ease, background .2s ease;
    }
    .play-badge svg {
      width: 24px;
      height: 24px;
      margin-left: 2px;
    }
    .card:hover .play-badge {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(225, 29, 72, 0.5);
    }
    .date-badge {
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      background: rgba(5, 5, 9, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      color: #f1f1f5;
    }
    .duration-badge {
      right: 12px;
      bottom: 12px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid rgba(244, 63, 94, 0.28);
    }
    .selector {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: var(--accent-strong);
      cursor: pointer;
    }
    .card-body {
      padding: 16px;
    }
    .file-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      word-break: break-word;
      margin-bottom: 10px;
    }
    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .meta-chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(148, 148, 168, 0.12);
      color: var(--muted);
      font-size: 12px;
    }
    .card-actions {
      display: flex;
      gap: 10px;
    }
    .card-actions .btn {
      flex: 1;
      height: 38px;
      font-size: 13px;
      font-weight: 600;
    }
    .empty {
      display: none;
      margin-top: 28px;
      padding: 72px 20px;
      text-align: center;
      color: var(--muted);
      background: rgba(13, 13, 20, 0.56);
      border: 1px dashed rgba(148, 148, 168, 0.18);
      border-radius: 24px;
    }
    .pagination {
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(13, 13, 20, 0.72);
      border: 1px solid rgba(148, 148, 168, 0.14);
    }
    .pagination-info {
      color: var(--muted);
      font-size: 14px;
    }
    .pagination-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pagination-actions .btn {
      min-width: 88px;
      height: 38px;
      padding: 0 14px;
      font-size: 13px;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      z-index: 200;
    }
    .modal.open {
      display: flex;
    }
    .modal-card {
      width: min(980px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(16, 16, 26, 0.98), rgba(10, 10, 18, 0.9));
      border: 1px solid rgba(148, 148, 168, 0.16);
      box-shadow: var(--shadow);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(244, 63, 94, 0.18);
    }
    .modal-head h3 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 600;
    }
    .modal-head p {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(148, 148, 168, 0.14);
      background: rgba(28, 28, 38, 0.88);
      color: var(--text);
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease;
    }
    .close-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .close-btn svg {
      width: 20px;
      height: 20px;
    }
    .preview-wrap {
      padding: 18px 22px 22px;
    }
    .preview-wrap video {
      width: 100%;
      max-height: 72vh;
      border-radius: 18px;
      background: #000;
      outline: none;
    }
    .replace-box {
      width: min(420px, 100%);
      padding: 24px;
    }
    .replace-box h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .replace-box p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .replace-box input[type="file"] {
      width: 100%;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(148, 148, 168, 0.18);
      background: rgba(13, 13, 20, 0.72);
      color: var(--text);
      font-family: inherit;
    }
    .replace-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .cover img {
        opacity: 1;
        transform: none;
      }
    }
    @media (max-width: 980px) {
      .hero h1 {
        font-size: 28px;
      }
      .toolbar {
        top: 8px;
      }
    }
    @media (max-width: 720px) {
      .shell {
        padding: 18px 14px 28px;
      }
      .hero,
      .toolbar {
        padding: 16px;
        border-radius: 18px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .control {
        width: 100%;
      }
      .toolbar .spacer {
        display: none;
      }
      .toolbar .btn {
        width: calc(50% - 6px);
      }
      .card-actions {
        flex-direction: column;
      }
      .replace-actions {
        flex-direction: column-reverse;
      }
      .pagination {
        flex-direction: column;
        align-items: stretch;
      }
      .pagination-actions .btn {
        width: calc(50% - 5px);
      }
    }
  </style>
  </head>
<body>
  <div class="shell">
    <section class="hero">
      <div>
        <div class="hero-top">
          <a href="/">&larr; 返回首页</a>
        </div>
        <h1 id="pageTitle">全部视频海报墙</h1>
        <p>点击海报即可直接预览视频；顶部筛选栏可按文件夹快速过滤内容，卡片同时展示时长、大小和所属文件夹。</p>
      </div>
      <div class="hero-stats">
        <div class="stat-card">
          <div class="label">筛选结果</div>
          <div class="value" id="statVisible">0</div>
        </div>
        <div class="stat-card">
          <div class="label">全部视频</div>
          <div class="value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="label">文件夹数</div>
          <div class="value" id="statFolders">0</div>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="control">
        <label for="folderFilter">文件夹筛选</label>
        <select id="folderFilter" onchange="applyFilters()">
          <option value="">全部文件夹</option>
        </select>
      </div>
      <div class="control">
        <label for="sortSelect">排序方式</label>
        <select id="sortSelect" onchange="applyFilters(false)">
          <option value="time_desc">时间从新到旧</option>
          <option value="time_asc">时间从旧到新</option>
          <option value="size_desc">文件大小从大到小</option>
          <option value="size_asc">文件大小从小到大</option>
          <option value="duration_desc">时长从长到短</option>
          <option value="duration_asc">时长从短到长</option>
        </select>
      </div>
      <div class="control">
        <label for="pageSizeSelect">每页数量</label>
        <select id="pageSizeSelect" onchange="changePageSize()">
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="25">25</option>
          <option value="30">30</option>
        </select>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-secondary" type="button" onclick="reloadData()">刷新数据</button>
      <button class="btn btn-secondary" type="button" onclick="toggleSelectAll()" id="btnSelectAll">全选当前筛选</button>
      <button class="btn btn-danger" type="button" id="btnBatchDelete" onclick="batchDelete()" disabled>批量删除</button>
    </section>

    <div class="status-row">
      <div id="statusText">正在加载海报墙数据...</div>
      <div>已选 <strong id="selectedCount">0</strong> 个</div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="emptyMsg" class="empty">当前筛选条件下暂无视频。</div>
    <div id="pagination" class="pagination">
      <div id="paginationInfo" class="pagination-info">第 1 / 1 页</div>
      <div class="pagination-actions">
        <button class="btn btn-secondary" type="button" id="btnFirstPage" onclick="setPage(1)">首页</button>
        <button class="btn btn-secondary" type="button" id="btnPrevPage" onclick="changePage(-1)">上一页</button>
        <button class="btn btn-secondary" type="button" id="btnNextPage" onclick="changePage(1)">下一页</button>
        <button class="btn btn-secondary" type="button" id="btnLastPage" onclick="setPage(getTotalPages())">末页</button>
      </div>
    </div>
  </div>

  <div id="previewModal" class="modal" onclick="closePreviewOnMask(event)" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h3 id="previewTitle">视频预览</h3>
          <p id="previewMeta">--</p>
        </div>
        <button class="close-btn" type="button" onclick="closePreview()" aria-label="关闭预览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="preview-wrap">
        <video id="previewVideo" controls preload="metadata"></video>
      </div>
    </div>
  </div>

  <div id="replaceModal" class="modal" onclick="closeReplaceOnMask(event)" role="dialog" aria-modal="true" aria-labelledby="replaceTitle">
    <div class="modal-card replace-box">
      <h3 id="replaceTitle">替换封面</h3>
      <p id="replaceMeta">请选择新的图片文件，支持 jpg、png、webp 等常见格式。</p>
      <input type="file" id="replaceFileInput" accept="image/*" />
      <div class="replace-actions">
        <button class="btn btn-secondary" type="button" onclick="closeReplaceModal()">取消</button>
        <button class="btn btn-primary" type="button" onclick="doReplaceCover()">确认替换</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const INITIAL_FOLDER = params.get('folder') || '';

    let allItems = [];
    let visibleItems = [];
    let selectedKeys = new Set();
    let durationCache = new Map();
    let durationProbeQueue = [];
    let durationProbeRunning = 0;
    let replaceTarget = null;
    let currentPage = 1;

    function itemKey(item) {
      return `${item.folder}::${item.stem}`;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function fmtSize(bytes) {
      if (bytes >= 1073741824) return `${(bytes / 1073741824).toFixed(2)} GB`;
      if (bytes >= 1048576) return `${(bytes / 1048576).toFixed(1)} MB`;
      if (bytes >= 1024) return `${(bytes / 1024).toFixed(0)} KB`;
      return `${bytes} B`;
    }

    function durationLabel(item) {
      return item.duration || durationCache.get(itemKey(item)) || '--:--';
    }

    function durationSeconds(item) {
      const raw = item.duration || durationCache.get(itemKey(item)) || '';
      const parts = raw.split(':').map(Number);
      if (!parts.length || parts.some(Number.isNaN)) return -1;
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return -1;
    }

    function buildSortValue(item) {
      return item.stem;
    }

    function getPageSize() {
      return Number(document.getElementById('pageSizeSelect').value) || 10;
    }

    function getTotalPages() {
      return Math.max(1, Math.ceil(visibleItems.length / getPageSize()));
    }

    function clampCurrentPage() {
      currentPage = Math.min(Math.max(currentPage, 1), getTotalPages());
    }

    function getCurrentPageItems() {
      const pageSize = getPageSize();
      const start = (currentPage - 1) * pageSize;
      return visibleItems.slice(start, start + pageSize);
    }

    async function loadItems() {
      const query = new URLSearchParams();
      const folderValue = document.getElementById('folderFilter').value;
      if (folderValue) query.set('folder', folderValue);

      const url = query.toString() ? `/api/poster?${query.toString()}` : '/api/poster';
      const resp = await fetch(url);
      const data = await resp.json();
      if (!data.ok) {
        throw new Error(data.error || '加载失败');
      }
      allItems = data.items || [];
      (data.items || []).forEach(item => {
        if (item.duration) {
          durationCache.set(itemKey(item), item.duration);
        }
      });
      renderFolderOptions(data.folders || []);
      updateStats(data.folders || []);
      applyFilters(false);
    }

    function renderFolderOptions(folders) {
      const select = document.getElementById('folderFilter');
      const currentValue = select.value || INITIAL_FOLDER;
      const options = ['<option value="">全部文件夹</option>'];
      folders.forEach(f => {
        const label = f.folder ? `${f.folder} (${f.count})` : `根目录 (${f.count})`;
        options.push(`<option value="${f.folder}">${label}</option>`);
      });
      select.innerHTML = options.join('');
      if (currentValue && folders.some(f => f.folder === currentValue)) {
        select.value = currentValue;
      } else {
        select.value = '';
      }
      syncPageTitle();
    }

    function updateStats(folders) {
      document.getElementById('statTotal').textContent = String(allItems.length);
      document.getElementById('statFolders').textContent = String(folders.length);
    }

    function syncPageTitle() {
      const folderValue = document.getElementById('folderFilter').value;
      document.getElementById('pageTitle').textContent = folderValue
        ? `${folderValue} 的视频海报墙`
        : '全部视频海报墙';

      const nextUrl = folderValue ? `/poster?folder=${encodeURIComponent(folderValue)}` : '/poster';
      history.replaceState(null, '', nextUrl);
    }

    function applyFilters(needReload = true) {
      if (needReload) {
        reloadData();
        return;
      }

      const folderValue = document.getElementById('folderFilter').value;
      const sortValue = document.getElementById('sortSelect').value;

      visibleItems = allItems.filter(item => !folderValue || item.folder === folderValue);

      visibleItems.sort((a, b) => {
        if (sortValue === 'time_asc') return buildSortValue(a).localeCompare(buildSortValue(b));
        if (sortValue === 'time_desc') return buildSortValue(b).localeCompare(buildSortValue(a));
        if (sortValue === 'size_asc') return a.size - b.size;
        if (sortValue === 'size_desc') return b.size - a.size;
        if (sortValue === 'duration_asc') return durationSeconds(a) - durationSeconds(b);
        if (sortValue === 'duration_desc') return durationSeconds(b) - durationSeconds(a);
        return 0;
      });

      selectedKeys = new Set(
        [...selectedKeys].filter(key => visibleItems.some(item => itemKey(item) === key))
      );

      currentPage = 1;
      syncPageTitle();
      renderGrid();
      scheduleDurationProbe();
    }

    function updateStatusText() {
      const folderValue = document.getElementById('folderFilter').value;
      const prefix = folderValue ? `${folderValue} · ` : '全部文件夹 · ';
      document.getElementById('statusText').innerHTML =
        `${prefix}共 <strong>${visibleItems.length}</strong> 个视频，当前第 <strong>${currentPage}</strong> / <strong>${getTotalPages()}</strong> 页`;
      document.getElementById('selectedCount').textContent = String(selectedKeys.size);
      document.getElementById('statVisible').textContent = String(visibleItems.length);
      document.getElementById('btnBatchDelete').disabled = selectedKeys.size === 0;
      document.getElementById('btnSelectAll').textContent =
        visibleItems.length > 0 && visibleItems.every(item => selectedKeys.has(itemKey(item)))
          ? '取消全选'
          : '全选当前筛选';
    }

    function renderPagination() {
      const pagination = document.getElementById('pagination');
      const totalPages = getTotalPages();
      const totalItems = visibleItems.length;
      const pageSize = getPageSize();
      const start = totalItems === 0 ? 0 : (currentPage - 1) * pageSize + 1;
      const end = Math.min(currentPage * pageSize, totalItems);

      if (totalItems === 0) {
        pagination.style.display = 'none';
        return;
      }

      pagination.style.display = 'flex';
      document.getElementById('paginationInfo').textContent =
        `第 ${currentPage} / ${totalPages} 页，显示 ${start}-${end} 项，共 ${totalItems} 项`;
      document.getElementById('btnFirstPage').disabled = currentPage === 1;
      document.getElementById('btnPrevPage').disabled = currentPage === 1;
      document.getElementById('btnNextPage').disabled = currentPage === totalPages;
      document.getElementById('btnLastPage').disabled = currentPage === totalPages;
    }

    function renderSkeletons(count) {
      const grid = document.getElementById('grid');
      document.getElementById('emptyMsg').style.display = 'none';
      document.getElementById('pagination').style.display = 'none';
      const cards = Array.from({ length: count }, () => `
        <div class="skeleton-card" aria-hidden="true">
          <div class="skeleton-cover"></div>
          <div class="skeleton-body">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
          </div>
        </div>
      `);
      grid.innerHTML = cards.join('');
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('emptyMsg');

      clampCurrentPage();
      const pageItems = getCurrentPageItems();
      updateStatusText();
      if (visibleItems.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        renderPagination();
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = pageItems.map(item => {
        const key = itemKey(item);
        const selected = selectedKeys.has(key);
        const thumbHtml = item.thumbnail_url
          ? `<img src="${item.thumbnail_url}" alt="${escapeHtml(item.video)} 的封面" loading="lazy" onload="this.classList.add('loaded')" />`
          : `<div class="fallback">MV</div>`;
        const folderLabel = item.folder || '根目录';
        return `
          <article class="card${selected ? ' selected' : ''}">
            <input
              class="selector"
              type="checkbox"
              ${selected ? 'checked' : ''}
              onchange="toggleSelect('${key}')"
              onclick="event.stopPropagation()"
              aria-label="选择视频"
            />
            <div class="cover" role="button" tabindex="0" aria-label="预览 ${escapeHtml(item.video)}" onclick="openPreview('${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPreview('${key}')}">
              ${thumbHtml}
              <div class="date-badge">${escapeHtml(folderLabel)}</div>
              <div class="play-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
              </div>
              <div class="duration-badge" data-duration-key="${key}">${durationLabel(item)}</div>
            </div>
            <div class="card-body">
              <div class="file-name" title="${escapeHtml(item.video)}">${escapeHtml(item.video)}</div>
              <div class="meta-row">
                <span class="meta-chip">${fmtSize(item.size)}</span>
                <span class="meta-chip">${escapeHtml(folderLabel)}</span>
                <span class="meta-chip">时长 <span data-duration-key="${key}">${durationLabel(item)}</span></span>
              </div>
              <div class="card-actions">
                <button class="btn btn-secondary" type="button" onclick="openReplaceModal('${key}')">替换封面</button>
                <button class="btn btn-danger" type="button" onclick="deleteItem('${key}')">删除</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
      renderPagination();
    }

    function setPage(page) {
      const nextPage = Math.min(Math.max(Number(page) || 1, 1), getTotalPages());
      if (nextPage === currentPage) return;
      currentPage = nextPage;
      renderGrid();
      scheduleDurationProbe();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changePage(delta) {
      setPage(currentPage + delta);
    }

    function changePageSize() {
      currentPage = 1;
      renderGrid();
      scheduleDurationProbe();
    }

    function findItemByKey(key) {
      return allItems.find(item => itemKey(item) === key) || null;
    }

    function toggleSelect(key) {
      if (selectedKeys.has(key)) {
        selectedKeys.delete(key);
      } else {
        selectedKeys.add(key);
      }
      renderGrid();
    }

    function toggleSelectAll() {
      if (visibleItems.length === 0) return;
      const allSelected = visibleItems.every(item => selectedKeys.has(itemKey(item)));
      if (allSelected) {
        visibleItems.forEach(item => selectedKeys.delete(itemKey(item)));
      } else {
        visibleItems.forEach(item => selectedKeys.add(itemKey(item)));
      }
      renderGrid();
    }

    function openPreview(key) {
      const item = findItemByKey(key);
      if (!item) return;
      const folderLabel = item.folder || '根目录';
      document.getElementById('previewTitle').textContent = item.video;
      document.getElementById('previewMeta').textContent =
        `${folderLabel} · ${fmtSize(item.size)} · 时长 ${durationLabel(item)}`;
      const video = document.getElementById('previewVideo');
      video.poster = item.thumb_url || item.thumbnail_url || '';
      video.src = item.video_url;
      video.play().catch(() => {});
      document.getElementById('previewModal').classList.add('open');
    }

    function closePreview() {
      const video = document.getElementById('previewVideo');
      video.pause();
      video.src = '';
      video.poster = '';
      document.getElementById('previewModal').classList.remove('open');
    }

    function closePreviewOnMask(event) {
      if (event.target.id === 'previewModal') {
        closePreview();
      }
    }

    function openReplaceModal(key) {
      const item = findItemByKey(key);
      if (!item) return;
      replaceTarget = item;
      const folderLabel = item.folder || '根目录';
      document.getElementById('replaceMeta').textContent = `${folderLabel} · ${item.video}`;
      document.getElementById('replaceFileInput').value = '';
      document.getElementById('replaceModal').classList.add('open');
    }

    function closeReplaceModal() {
      replaceTarget = null;
      document.getElementById('replaceModal').classList.remove('open');
    }

    function closeReplaceOnMask(event) {
      if (event.target.id === 'replaceModal') {
        closeReplaceModal();
      }
    }

    async function doReplaceCover() {
      const input = document.getElementById('replaceFileInput');
      if (!replaceTarget) return;
      if (!input.files || !input.files[0]) {
        alert('请选择图片文件');
        return;
      }

      const formData = new FormData();
      formData.append('folder', replaceTarget.folder);
      formData.append('stem', replaceTarget.stem);
      formData.append('file', input.files[0]);

      const resp = await fetch('/api/poster/replace-cover', {
        method: 'POST',
        body: formData,
      });
      const data = await resp.json();
      if (!data.ok) {
        alert(data.error || '替换失败');
        return;
      }

      replaceTarget.thumb = data.thumb;
      const folderQ = encodeURIComponent(replaceTarget.folder);
      replaceTarget.thumbnail_url = `/api/poster-thumb?folder=${folderQ}&name=${encodeURIComponent(data.thumb)}&t=${Date.now()}`;
      closeReplaceModal();
      renderGrid();
    }

    async function deleteItem(key) {
      const item = findItemByKey(key);
      if (!item) return;
      if (!confirm(`确认删除 ${item.video} 及其封面吗？`)) return;

      const resp = await fetch('/api/poster/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder: item.folder, stems: [item.stem] }),
      });
      const data = await resp.json();
      if (!data.ok) {
        alert(data.error || '删除失败');
        return;
      }

      allItems = allItems.filter(current => itemKey(current) !== key);
      selectedKeys.delete(key);
      applyFilters(false);
    }

    async function batchDelete() {
      if (selectedKeys.size === 0) return;
      if (!confirm(`确认删除选中的 ${selectedKeys.size} 个视频吗？`)) return;

      const groups = new Map();
      visibleItems
        .filter(item => selectedKeys.has(itemKey(item)))
        .forEach(item => {
          if (!groups.has(item.folder)) {
            groups.set(item.folder, []);
          }
          groups.get(item.folder).push(item.stem);
        });

      for (const [folder, stems] of groups.entries()) {
        const resp = await fetch('/api/poster/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folder, stems }),
        });
        const data = await resp.json();
        if (!data.ok) {
          alert(data.error || `${folder || '根目录'} 删除失败`);
          return;
        }
      }

      allItems = allItems.filter(item => !selectedKeys.has(itemKey(item)));
      selectedKeys.clear();
      applyFilters(false);
    }

    function updateDurationView(key, label) {
      document.querySelectorAll(`[data-duration-key="${CSS.escape(key)}"]`).forEach(node => {
        node.textContent = label;
      });
    }

    function scheduleDurationProbe() {
      const missing = getCurrentPageItems().filter(item => !durationCache.get(itemKey(item)) && !item.duration);
      durationProbeQueue = missing.map(item => itemKey(item));
      if (durationProbeQueue.length === 0) return;
      runDurationProbe();
      runDurationProbe();
    }

    function runDurationProbe() {
      if (durationProbeRunning >= 2) return;
      const nextKey = durationProbeQueue.shift();
      if (!nextKey) return;
      const item = findItemByKey(nextKey);
      if (!item) {
        runDurationProbe();
        return;
      }

      durationProbeRunning += 1;
      const probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.src = item.video_url;
      probe.onloadedmetadata = () => {
        const total = Math.max(0, Math.round(probe.duration || 0));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        const label = hours > 0
          ? `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
          : `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        durationCache.set(nextKey, label);
        updateDurationView(nextKey, label);
        cleanup();
      };
      probe.onerror = cleanup;
      probe.load();

      function cleanup() {
        probe.src = '';
        durationProbeRunning -= 1;
        runDurationProbe();
      }
    }

    async function reloadData() {
      document.getElementById('statusText').textContent = '正在刷新数据...';
      renderSkeletons(getPageSize());
      try {
        await loadItems();
      } catch (error) {
        document.getElementById('grid').innerHTML = '';
        document.getElementById('emptyMsg').style.display = 'block';
        document.getElementById('statusText').textContent = error.message || '加载失败';
      }
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closePreview();
        closeReplaceModal();
      }
    });

    document.getElementById('folderFilter').value = INITIAL_FOLDER;
    reloadData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>瀑布流预览</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/design-system.css') }}" />
</head>
<body>
  <div class="shell shell--narrow">
    <!-- ═══════════ Header ═══════════ -->
    <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: var(--ds-space-4); margin: var(--ds-space-6) 0 var(--ds-space-4); flex-wrap: wrap;">
      <div>
        <a class="hero-nav" href="/">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          返回首页
        </a>
        <h1 style="margin-top: var(--ds-space-2); font-size: var(--ds-text-2xl); font-weight: 700; color: var(--ds-text-primary); letter-spacing: var(--ds-tracking-tight);">瀑布流</h1>
        <div id="configLine" class="muted-darker text-sm" style="margin-top: var(--ds-space-1);"></div>
      </div>
      <div class="btn-group">
        <button class="btn btn-ghost" type="button" onclick="openSettings()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          设置
        </button>
        <button class="btn btn-ghost" type="button" onclick="reloadData()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          刷新
        </button>
        <button class="btn btn-ghost" type="button" id="selectAllBtn" onclick="toggleSelectAll()">全选当前页</button>
        <button class="btn btn-primary" type="button" id="downloadBtn" onclick="downloadSelected()" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载选中
        </button>
      </div>
    </header>

    <!-- ═══════════ Sticky Dock ═══════════ -->
    <section class="dock">
      <nav id="tabs" class="dock-tabs" aria-label="标签"></nav>
      <div class="status-bar" style="margin-top: var(--ds-space-3);">
        <div id="statusText">正在加载...</div>
        <div class="status-bar-side">
          <div>已选 <strong id="selectedCount">0</strong> 个</div>
          <div class="pager">
            <button class="btn btn-secondary btn-sm" type="button" id="prevPageBtn" onclick="changePage(-1)">上一页</button>
            <span id="pageInfo" class="page-info">第 1 页</span>
            <button class="btn btn-secondary btn-sm" type="button" id="nextPageBtn" onclick="changePage(1)">下一页</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════ Masonry Grid ═══════════ -->
    <section id="masonry" class="masonry"></section>
    <div id="empty" class="empty-state">当前配置下没有可预览的视频。</div>
  </div>

  <!-- ═══════════ Settings Modal ═══════════ -->
  <div id="settingsModal" class="modal" onclick="closeSettingsOnMask(event)">
    <div class="modal-dialog" style="max-width: 460px;">
      <div class="modal-header">
        <div>
          <h2 class="modal-title">瀑布流设置</h2>
          <p class="modal-subtitle">这里只影响瀑布流预览，不会改动下载页的定时下载筛选。</p>
        </div>
        <button type="button" class="drawer-close" onclick="closeSettings()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="drawer-grid">
          <div class="field">
            <label for="settingsPerPage">分页展示数量</label>
            <select id="settingsPerPage">
              {% for value in page_size_options %}
              <option value="{{ value }}" {% if config.per_page == value %}selected{% endif %}>{{ value }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label for="settingsSort">排序方式</label>
            <select id="settingsSort">
              {% for option in sort_options %}
              <option value="{{ option.value }}" {% if config.sort == option.value %}selected{% endif %}>{{ option.label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label for="settingsRange">时间范围</label>
            <select id="settingsRange">
              {% for option in range_options %}
              <option value="{{ option.value }}" {% if config.range == option.value %}selected{% endif %}>{{ option.label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label for="settingsTimeFilter">时间筛选</label>
            <select id="settingsTimeFilter">
              {% for option in time_filter_options %}
              <option value="{{ option.min }}-{{ option.max }}" data-min="{{ option.min }}" data-max="{{ option.max }}" {% if config.min_time == option.min and config.max_time == option.max %}selected{% endif %}>{{ option.label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" onclick="closeSettings()">取消</button>
        <button class="btn btn-primary" type="button" onclick="saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ Preview Modal ═══════════ -->
  <div id="previewModal" class="player-modal" onclick="closePreviewOnMask(event)">
    <div class="player-container">
      <div class="player-header">
        <div id="previewTitle" class="player-title">视频预览</div>
        <button class="player-close" type="button" onclick="closePreview()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <video id="previewVideo" class="player-video" controls preload="metadata"></video>
    </div>
  </div>

  <script>
    const initialTabs = {{ tabs | tojson }};
    const initialConfig = {{ config | tojson }};

    let tabs = initialTabs;
    let currentConfig = Object.assign({}, initialConfig);
    let currentTag = new URLSearchParams(location.search).get('tag') || '';
    let currentPage = Math.max(1, parseInt(new URLSearchParams(location.search).get('page') || '1', 10) || 1);
    let pagination = { page: currentPage, per_page: currentConfig.per_page || 10, has_next: false };
    let items = [];
    let loadError = '';
    let selectedIds = new Set();
    let loading = false;

    function renderConfigLine(cfg) {
      if (!cfg) return;
      document.getElementById('configLine').textContent = '排序 ' + (cfg.sort || '-') + ' / 范围 ' + (cfg.range || '-') + ' / 时长 ' + (cfg.min_time || 0) + '-' + (cfg.max_time || 0) + ' 秒 / 每页 ' + (cfg.per_page || 10);
    }

    function escapeHtml(v) { return String(v || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;'); }
    function jsString(v) { return String(v || '').replaceAll('\\', '\\\\').replaceAll("'", "\\'").replaceAll('\n', '\\n').replaceAll('\r', '\\r'); }
    function itemById(id) { return items.find(item => item.id === id) || null; }
    function tabName(code) { const t = tabs.find(n => n.code === code); return t ? t.name : '全部'; }

    function setTimeFilterValue(minTime, maxTime) {
      const sel = document.getElementById('settingsTimeFilter');
      const val = '' + (parseInt(minTime || 0)) + '-' + (parseInt(maxTime || 0));
      if ([...sel.options].some(o => o.value === val)) sel.value = val; else sel.value = '0-86400';
    }

    function getSelectedTimeFilter() {
      const o = document.getElementById('settingsTimeFilter').selectedOptions[0];
      return { min: parseInt(o.dataset.min || '0', 10), max: parseInt(o.dataset.max || '86400', 10) };
    }

    function openSettings() {
      document.getElementById('settingsPerPage').value = '' + (currentConfig.per_page || 10);
      document.getElementById('settingsSort').value = currentConfig.sort || 'pv';
      document.getElementById('settingsRange').value = currentConfig.range || 'daily';
      setTimeFilterValue(currentConfig.min_time || 0, currentConfig.max_time || 86400);
      document.getElementById('settingsModal').classList.add('open');
      document.body.classList.add('modal-open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
      document.body.classList.remove('modal-open');
    }

    function closeSettingsOnMask(e) { if (e.target === document.getElementById('settingsModal')) closeSettings(); }

    async function saveSettings() {
      const tf = getSelectedTimeFilter();
      const payload = {
        per_page: parseInt(document.getElementById('settingsPerPage').value, 10),
        sort: document.getElementById('settingsSort').value,
        range: document.getElementById('settingsRange').value,
        min_time: tf.min,
        max_time: tf.max,
      };
      try {
        const resp = await fetch('/api/waterfall/settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || '保存失败');
        currentConfig = data.config || payload;
        currentPage = 1;
        pagination.page = 1;
        pagination.per_page = currentConfig.per_page || payload.per_page;
        pagination.has_next = false;
        closeSettings();
        updateUrl();
        renderConfigLine(currentConfig);
        await loadData();
      } catch (error) { alert(error.message || '保存失败'); }
    }

    function updateUrl() {
      const p = new URLSearchParams();
      if (currentTag) p.set('tag', currentTag);
      if (currentPage > 1) p.set('page', '' + currentPage);
      const q = p.toString();
      history.replaceState(null, '', q ? '/waterfall?' + q : '/waterfall');
    }

    function renderTabs() {
      const box = document.getElementById('tabs');
      box.innerHTML = tabs.map(tab => '<button type="button" class="dock-tab' + (tab.code === currentTag ? ' active' : '') + '" onclick="switchTab(\'' + jsString(tab.code) + '\')">' + escapeHtml(tab.name) + '</button>').join('');
    }

    function renderStatus() {
      const status = document.getElementById('statusText');
      const selectedCount = document.getElementById('selectedCount');
      const selectAllBtn = document.getElementById('selectAllBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const prevPageBtn = document.getElementById('prevPageBtn');
      const nextPageBtn = document.getElementById('nextPageBtn');
      const pageInfo = document.getElementById('pageInfo');

      selectedCount.textContent = '' + selectedIds.size;
      downloadBtn.disabled = selectedIds.size === 0 || loading;
      selectAllBtn.disabled = items.length === 0 || loading;
      selectAllBtn.textContent = items.length && items.every(item => selectedIds.has(item.id)) ? '取消全选' : '全选当前页';
      prevPageBtn.disabled = loading || pagination.page <= 1;
      nextPageBtn.disabled = loading || !pagination.has_next;
      pageInfo.textContent = '第 ' + pagination.page + ' 页';
      if (loading) { status.innerHTML = '正在加载 <strong>' + escapeHtml(tabName(currentTag)) + '</strong> 第 ' + pagination.page + ' 页...'; return; }
      if (loadError) { status.innerHTML = '<strong>' + escapeHtml(loadError) + '</strong>'; return; }
      status.innerHTML = '<strong>' + escapeHtml(tabName(currentTag)) + '</strong> 当前页共 ' + items.length + ' 个视频';
    }

    function renderCards() {
      const masonry = document.getElementById('masonry');
      const empty = document.getElementById('empty');
      if (!items.length) {
        masonry.innerHTML = '';
        empty.style.display = loading ? 'none' : 'block';
        renderStatus();
        return;
      }
      empty.style.display = 'none';
      masonry.innerHTML = items.map(item => {
        const sel = selectedIds.has(item.id);
        const thumb = item.thumbnail
          ? '<img src="' + escapeHtml(item.thumbnail) + '" alt="' + escapeHtml(item.title || item.id) + '" loading="lazy" />'
          : '<div class="masonry-fallback">视频</div>';
        const duration = item.duration != null ? '<span class="masonry-pill">' + escapeHtml('' + item.duration) + ' 秒</span>' : '';
        const pv = item.pv != null ? '<span class="masonry-pill">' + escapeHtml('' + item.pv) + ' 播放</span>' : '';
        const favorite = item.favorite_count != null ? '<span class="masonry-pill">' + escapeHtml('' + item.favorite_count) + ' 收藏</span>' : '';
        return '<article class="masonry-card' + (sel ? ' selected' : '') + '" data-id="' + escapeHtml(item.id) + '">'
          + '<div class="masonry-poster" onclick="openPreview(\'' + jsString(item.id) + '\')">'
          + '<input class="masonry-select" type="checkbox"' + (sel ? ' checked' : '') + ' onclick="event.stopPropagation()" onchange="toggleSelect(\'' + jsString(item.id) + '\')" aria-label="选择视频" />'
          + thumb
          + '<div class="masonry-play" aria-hidden="true"></div>'
          + '</div>'
          + '<div class="masonry-body">'
          + '<div class="masonry-title">' + escapeHtml(item.title || item.id) + '</div>'
          + '<div class="masonry-meta">'
          + '<span class="masonry-pill">' + escapeHtml(item.id) + '</span>'
          + duration + pv + favorite
          + '</div>'
          + '</div>'
          + '</article>';
      }).join('');
      renderStatus();
    }

    function renderSkeletons(count) {
      const masonry = document.getElementById('masonry');
      document.getElementById('empty').style.display = 'none';
      let html = '';
      for (let i = 0; i < count; i++) {
        html += '<div class="skeleton"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line"></div><div style="display:flex;gap:4px;margin-top:6px;"><div style="height:14px;width:36px;border-radius:4px;background:var(--ds-bg-raised)"></div><div style="height:14px;width:36px;border-radius:4px;background:var(--ds-bg-raised)"></div></div></div></div>';
      }
      masonry.innerHTML = html;
    }

    async function loadData() {
      loading = true;
      loadError = '';
      selectedIds.clear();
      renderTabs();
      renderSkeletons(currentConfig.per_page || 10);
      renderStatus();
      try {
        const p = new URLSearchParams();
        if (currentTag) p.set('tag', currentTag);
        if (currentPage > 1) p.set('page', '' + currentPage);
        const q = p.toString();
        const resp = await fetch(q ? '/api/waterfall?' + q : '/api/waterfall');
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || '加载失败');
        tabs = Array.isArray(data.tabs) ? data.tabs : tabs;
        items = Array.isArray(data.items) ? data.items : [];
        if (data.config) currentConfig = data.config;
        if (data.pagination) {
          pagination = { page: data.pagination.page || currentPage, per_page: data.pagination.per_page || currentConfig.per_page || 10, has_next: Boolean(data.pagination.has_next) };
          currentPage = pagination.page;
        } else {
          pagination = { page: currentPage, per_page: currentConfig.per_page || 10, has_next: false };
        }
        renderConfigLine(currentConfig);
        updateUrl();
      } catch (error) {
        items = [];
        loadError = error.message || '加载失败';
        pagination = { page: currentPage, per_page: currentConfig.per_page || 10, has_next: false };
        renderConfigLine(currentConfig);
      } finally {
        loading = false;
        renderTabs();
        renderCards();
      }
    }

    function switchTab(code) {
      if (code === currentTag || loading) return;
      currentTag = code;
      currentPage = 1;
      pagination.page = 1;
      pagination.has_next = false;
      updateUrl();
      loadData();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changePage(delta) {
      if (loading) return;
      const next = currentPage + delta;
      if (next < 1) return;
      if (delta > 0 && !pagination.has_next) return;
      currentPage = next;
      pagination.page = next;
      updateUrl();
      loadData();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function reloadData() { if (!loading) loadData(); }

    function updateCardSelected(id) {
      const card = document.querySelector('.masonry-card[data-id="' + CSS.escape(id) + '"]');
      if (!card) return;
      const cb = card.querySelector('.masonry-select');
      if (selectedIds.has(id)) { card.classList.add('selected'); if (cb) cb.checked = true; }
      else { card.classList.remove('selected'); if (cb) cb.checked = false; }
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
      updateCardSelected(id);
      renderStatus();
    }

    function toggleSelectAll() {
      if (!items.length) return;
      const all = items.every(item => selectedIds.has(item.id));
      if (all) items.forEach(item => selectedIds.delete(item.id));
      else items.forEach(item => selectedIds.add(item.id));
      items.forEach(item => updateCardSelected(item.id));
      renderStatus();
    }

    function openPreview(id) {
      const item = itemById(id);
      if (!item) return;
      const url = item.preview_url || item.url;
      if (!url) return;
      document.getElementById('previewTitle').textContent = item.title || item.id;
      const video = document.getElementById('previewVideo');
      video.poster = item.thumbnail || '';
      video.src = url;
      video.play().catch(function(){});
      document.getElementById('previewModal').classList.add('open');
      document.body.classList.add('modal-open');
    }

    function closePreview() {
      const video = document.getElementById('previewVideo');
      video.pause();
      video.src = '';
      video.poster = '';
      document.getElementById('previewModal').classList.remove('open');
      document.body.classList.remove('modal-open');
    }

    function closePreviewOnMask(e) { if (e.target.id === 'previewModal') closePreview(); }

    async function downloadSelected() {
      const sel = items.filter(item => selectedIds.has(item.id));
      if (!sel.length || loading) return;
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.textContent = '下载中...';
      try {
        const resp = await fetch('/api/waterfall/download', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ tag_code: currentTag, items: sel }),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || '下载失败');
        alert('下载完成：成功 ' + data.success + '，跳过 ' + data.skipped + '，失败 ' + data.failed);
        selectedIds.clear();
        renderCards();
      } catch (error) { alert(error.message || '下载失败'); }
      finally { btn.textContent = '下载选中'; renderStatus(); }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { closePreview(); closeSettings(); }
    });

    if (!tabs.some(tab => tab.code === currentTag)) currentTag = '';
    renderConfigLine(currentConfig);
    renderTabs();
    updateUrl();
    loadData();
  </script>
</body>
</html>

services:
  twitter-ero-video-ranking-downloader:
    # NAS 部署用：从阿里云 ACR 拉取 CI 自动构建的镜像（回滚时把 latest 换成 sha-xxxxxxx）
    image: registry.cn-hangzhou.aliyuncs.com/docker-hexb/twitter-ero-video-ranking-downloader:latest
    container_name: twitter-ero-video-ranking-downloader
    restart: unless-stopped
    ports:
      - "2617:2617"
    volumes:
      - /vol1/1000/AdultMedia/tw:/data/downloads
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai

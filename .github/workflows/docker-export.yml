name: Build and Export Offline Docker Image

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build
        run: |
          IMAGE_NAME="twitter-ero-video-ranking-downloader"
          TAG="latest"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          fi
          FULL_IMAGE_NAME="${IMAGE_NAME}:${TAG}-${{ matrix.suffix }}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" >> $GITHUB_ENV
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --load \
            -t ${FULL_IMAGE_NAME} .

      - name: Save Docker image to tarball
        run: |
          docker save ${FULL_IMAGE_NAME} -o ${IMAGE_NAME}-${TAG}-offline-${{ matrix.suffix }}.tar

      - name: Compress Docker image tarball
        run: |
          gzip ${IMAGE_NAME}-${TAG}-offline-${{ matrix.suffix }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ env.TAG }}-offline-${{ matrix.suffix }}
          path: ${{ env.IMAGE_NAME }}-${{ env.TAG }}-offline-${{ matrix.suffix }}.tar.gz
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IMAGE_NAME }}-${{ env.TAG }}-offline-${{ matrix.suffix }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

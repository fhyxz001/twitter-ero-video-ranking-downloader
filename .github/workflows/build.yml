name: Build ARM Docker Image

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push image to GitHub Container Registry"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event.inputs.push_to_registry == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-arm64,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1,suffix=-arm64
            type=sha,prefix=,suffix=-arm64

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' || github.event.inputs.push_to_registry == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Save image as tarball (for offline use)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_registry != 'true'
        run: |
          IMAGE_TAG="${{ steps.meta.outputs.tags }}"
          FIRST_TAG=$(echo "$IMAGE_TAG" | head -n1 | tr -d '[:space:]')
          if [ -z "$FIRST_TAG" ]; then
            FIRST_TAG="twitter-ero-video-ranking-downloader:build-arm64"
            docker buildx build \
              --platform linux/arm64 \
              --load \
              -t "$FIRST_TAG" \
              .
          fi
          ARCHIVE_NAME="twitter-ero-video-ranking-downloader-arm64"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            ARCHIVE_NAME="twitter-ero-video-ranking-downloader-${GITHUB_REF#refs/tags/}-arm64"
          fi
          docker save "$FIRST_TAG" -o "${ARCHIVE_NAME}.tar"
          gzip "${ARCHIVE_NAME}.tar"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload image artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_registry != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-arm64
          path: ${{ env.ARCHIVE_NAME }}.tar.gz
          retention-days: 7

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
